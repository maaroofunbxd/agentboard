[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentboard"
dynamic = ["version"]
description = "A board between AI agent sessions: posts, claims, hand-offs and replies, in a plain file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "typer>=0.15.0",
    "rich",
]

[project.scripts]
agents = "agentboard.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.dynamic]
version = { attr = "agentboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentboard"]
